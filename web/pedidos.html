<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="pedidos">

  <header>
    <h1>Padaria</h1>

    <nav>
      <a href="produtos.html">Produtos</a>
      <a class="active" href="pedidos.html">Pedidos</a>
    </nav>
  </header>

  <main>
    <h2>Pedidos</h2>

    <form id="formPedido">
      <h3 id="tituloPedido">Novo pedido</h3>

      <input id="clientePedido" placeholder="Nome do cliente" required maxlength="100">

      <select id="produtoPedido" required>
        <option value="">Carregando produtos</option>
      </select>

      <input id="quantidadePedido" type="number" min="1" step="1" value="1" required>

      <button type="submit">Salvar</button>
      <button id="cancelarPedido" type="button" hidden>Cancelar</button>
    </form>

    <input id="buscaPedidos" type="search" placeholder="Buscar cliente ou produto">

    <p id="resumoPedidos"></p>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Produto</th>
          <th>Quantidade</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaPedidos"></tbody>
    </table>

    <p id="pedidosVazios" hidden>Nenhum pedido encontrado.</p>

    <p id="mensagem" role="status"></p>
  </main>

  <script src="script.js"></script>

</body>

</html>
