<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="produtos">

  <header>
    <h1>Padaria</h1>

    <nav>
      <a class="active" href="produtos.html">Produtos</a>
      <a href="pedidos.html">Pedidos</a>
    </nav>
  </header>

  <main>
    <h2>Produtos</h2>

    <form id="formProduto">
      <h3 id="tituloProduto">Novo produto</h3>

      <input id="nomeProduto" placeholder="Nome do produto" required maxlength="80">
      <input id="precoProduto" type="number" min="0.01" step="0.01" placeholder="Preço" required>
      <input id="estoqueProduto" type="number" min="0" step="1" placeholder="Estoque" required>

      <button type="submit">Salvar</button>
      <button id="cancelarProduto" type="button" hidden>Cancelar</button>
    </form>

    <input id="buscaProdutos" type="search" placeholder="Buscar produto">

    <p id="resumoProdutos"></p>

    <table>
      <thead>
        <tr>
          <th>Produto</th>
          <th>Preço</th>
          <th>Estoque</th>
          <th>Situação</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaProdutos"></tbody>
    </table>

    <p id="produtosVazios" hidden>Nenhum produto encontrado.</p>

    <p id="mensagem" role="status"></p>
  </main>

  <script src="script.js"></script>

</body>

</html>
